<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffd76b">
    <meta name="description" content="A bright space for curious minds to turn little thoughts into what's next.">
    <title>Aura - a spark for what's next</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="#home">Aura</a>
        <div class="nav-links">
            <a class="active" href="#home">Home</a>
            <a href="#gallery">Gallery</a>
        </div>
        <a class="sign-in" href="#sign-in">Sign in</a>
    </nav>

    <main>
        <section class="hero" id="home">
            <div class="hero-copy">
                <p class="eyebrow">A little inspiration</p>
                <h1>Big things start<br>with a <span>spark.</span></h1>
                <p class="description">A bright space for curious minds to turn little thoughts into what's next.</p>
                <a class="cta" href="#gallery">Explore Aura <span aria-hidden="true">→</span></a>
            </div>
            <img
                class="hero-image"
                id="gallery"
                src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1400&q=85"
                alt="Sunlight falling across a field at sunrise"
            >
        </section>
        <span class="anchor" id="sign-in"></span>
    </main>
</body>
</html>
